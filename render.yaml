# ─── render.yaml — Render Blueprint for EduSphere ────────────────────────────
# Connect your GitHub repo in Render → Blueprints → "New Blueprint Instance".
# After the first sync, set the env vars marked "sync: false" in the Dashboard.
#
# Required env vars (set in Render Dashboard):
#   Backend  → FRONTEND_URL, JWT_SECRET
#   ML       → CORS_ORIGINS
#   Frontend → VITE_API_URL
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. Frontend — Static Site (React / Vite) ──────────────────────────────
  - type: web
    name: edusphere-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # ── 2. Backend — Web Service (Node.js / Express) ──────────────────────────
  - type: web
    name: edusphere-api
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false

  # ── 3. ML Service — Web Service (Python / Flask) ──────────────────────────
  - type: web
    name: edusphere-ml
    env: python
    buildCommand: cd ml-service && pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: cd ml-service && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: CORS_ORIGINS
        sync: false
      - key: ML_SECRET
        sync: false
      - key: DB_PATH
        sync: false
